    <ellipse cx="256" cy="256" rx="62" ry="150"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="96" y1="186" x2="416" y2="186"/>
  </g>
  <g transform="rotate(-22 256 256)">
